<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Verified AI and ML technology stack</title>
  <desc id="desc">A readable visual stack grouped into RAG and LLM applications, retrieval, applied machine learning, evaluation, serving, and quality engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#102a42"/>
      <stop offset="1" stop-color="#1c1739"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill: #82a1c1; font-size: 15px; font-weight: 800; letter-spacing: 3px; }
      .title { fill: url(#titleGradient); font-size: 35px; font-weight: 850; letter-spacing: -.5px; }
      .subtitle { fill: #a5bad0; font-size: 15px; }
      .section { fill: #dce9f7; font-size: 14px; font-weight: 800; letter-spacing: .4px; }
      .hint { fill: #7694b3; font-size: 11px; }
      .card { fill: #122a43; stroke: #315677; stroke-width: 1.4; }
      .cardTitle { fill: #f2f8ff; font-size: 15px; font-weight: 800; }
      .cardText { fill: #99b1ca; font-size: 11px; }
      .iconText { fill: #061523; font-size: 12px; font-weight: 900; }
      .footer { fill: #7793b1; font-size: 11px; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="1000" height="650" rx="22" fill="url(#bg)"/>
  <circle cx="944" cy="-20" r="190" fill="#7c3aed" opacity=".12"/>
  <circle cx="-35" cy="650" r="180" fill="#0891b2" opacity=".1"/>
  <text x="42" y="48" class="sans eyebrow">AI / ML STACK</text>
  <text x="42" y="92" class="sans title">Tools I can explain from implementation</text>
  <text x="42" y="120" class="sans subtitle">A recruiter-readable view of the technologies demonstrated in my public repositories.</text>
  <rect x="813" y="32" width="145" height="32" rx="16" fill="#103d4a" stroke="#2a7d8b"/>
  <circle cx="833" cy="48" r="5" fill="#6ee7b7"/>
  <text x="846" y="53" class="sans" fill="#a7f3d0" font-size="11" font-weight="800">VERIFIED STACK</text>
  <path d="M42 148 H958" stroke="#2b4867" stroke-width="1"/>

  <text x="42" y="181" class="sans section">01  RAG + LLM APPLICATIONS</text>
  <text x="42" y="202" class="sans hint">grounded generation · local inference · retrieval quality</text>
  <g>
    <rect x="42" y="220" width="286" height="96" rx="13" class="card"/>
    <circle cx="77" cy="258" r="21" fill="#67e8f9"/><text x="77" y="263" text-anchor="middle" class="sans iconText">R</text>
    <text x="113" y="253" class="sans cardTitle">RAG + LLM applications</text><text x="113" y="276" class="sans cardText">RAG · Ollama · local inference</text><text x="113" y="296" class="sans cardText">guardrails · citations · provenance</text>
    <rect x="357" y="220" width="286" height="96" rx="13" class="card"/>
    <circle cx="392" cy="258" r="21" fill="#60a5fa"/><text x="392" y="263" text-anchor="middle" class="sans iconText">E</text>
    <text x="428" y="253" class="sans cardTitle">Embeddings + retrieval</text><text x="428" y="276" class="sans cardText">embeddings · dense retrieval</text><text x="428" y="296" class="sans cardText">hybrid search · pgvector · reranking</text>
    <rect x="672" y="220" width="286" height="96" rx="13" class="card"/>
    <circle cx="707" cy="258" r="21" fill="#a78bfa"/><text x="707" y="263" text-anchor="middle" class="sans iconText">G</text>
    <text x="743" y="253" class="sans cardTitle">Grounded output</text><text x="743" y="276" class="sans cardText">context selection · validation</text><text x="743" y="296" class="sans cardText">no-evidence handling · ACLs</text>
  </g>

  <text x="42" y="365" class="sans section">02  APPLIED ML + EVALUATION</text>
  <text x="42" y="386" class="sans hint">leakage-aware workflows · temporal validation · task-appropriate metrics</text>
  <g>
    <rect x="42" y="404" width="286" height="96" rx="13" class="card"/>
    <circle cx="77" cy="442" r="21" fill="#fbbf24"/><text x="77" y="447" text-anchor="middle" class="sans iconText">M</text>
    <text x="113" y="437" class="sans cardTitle">Applied machine learning</text><text x="113" y="460" class="sans cardText">scikit-learn · TensorFlow/Keras</text><text x="113" y="480" class="sans cardText">feature engineering · imbalance handling</text>
    <rect x="357" y="404" width="286" height="96" rx="13" class="card"/>
    <circle cx="392" cy="442" r="21" fill="#6ee7b7"/><text x="392" y="447" text-anchor="middle" class="sans iconText">V</text>
    <text x="428" y="437" class="sans cardTitle">Validation + metrics</text><text x="428" y="460" class="sans cardText">leakage auditing · temporal splits</text><text x="428" y="480" class="sans cardText">threshold tuning · model evaluation</text>
    <rect x="672" y="404" width="286" height="96" rx="13" class="card"/>
    <circle cx="707" cy="442" r="21" fill="#f0abfc"/><text x="707" y="447" text-anchor="middle" class="sans iconText">S</text>
    <text x="743" y="437" class="sans cardTitle">Spark data + ML</text><text x="743" y="460" class="sans cardText">PySpark · Spark SQL · Spark ML</text><text x="743" y="480" class="sans cardText">ETL · DataFrames · RDDs</text>
  </g>

  <text x="42" y="549" class="sans section">03  AI APPLICATION ENGINEERING</text>
  <text x="42" y="570" class="sans hint">inference APIs · reproducibility · containerized packaging</text>
  <g>
    <rect x="42" y="588" width="286" height="36" rx="10" class="card"/><text x="61" y="611" class="sans cardText">FASTAPI  ·  STREAMLIT  ·  POSTGRESQL</text>
    <rect x="357" y="588" width="286" height="36" rx="10" class="card"/><text x="376" y="611" class="sans cardText">PYTEST  ·  RUFF  ·  GITHUB ACTIONS</text>
    <rect x="672" y="588" width="286" height="36" rx="10" class="card"/><text x="691" y="611" class="sans cardText">DOCKER  ·  KUBERNETES PACKAGING</text>
  </g>
</svg>

