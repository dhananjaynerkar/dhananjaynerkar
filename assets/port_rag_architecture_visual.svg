<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Port RAG verified system architecture</title>
  <desc id="desc">A repository-backed architecture map for the local-first Port Management RAG prototype, from PDF and OCR ingestion through hybrid retrieval, access controls, local generation, and citation validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#42d6c5"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="48" y="53" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">PORT RAG · VERIFIED SYSTEM VIEW</text>
  <text x="48" y="78" fill="#92a4ba" font-family="Arial, sans-serif" font-size="14">Local-first prototype architecture reconstructed from repository implementation evidence</text>
  <path d="M42 99H1158" stroke="#26344a" stroke-width="2"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="48" y="132" width="250" height="126" rx="18" fill="#142234" stroke="#2c4862"/>
    <rect x="325" y="132" width="250" height="126" rx="18" fill="#12333a" stroke="#2c8b86"/>
    <rect x="602" y="132" width="250" height="126" rx="18" fill="#1d203b" stroke="#4b4a83"/>
    <rect x="879" y="132" width="273" height="126" rx="18" fill="#2a2135" stroke="#77506f"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="72" y="165" fill="#7dd3fc" font-size="14" font-weight="700">01 · INGEST</text>
    <text x="72" y="199" fill="#f8fafc" font-size="21" font-weight="700">PDF / OCR sources</text>
    <text x="72" y="226" fill="#b4c3d4" font-size="15">Provenance · quarantine</text>
    <text x="72" y="247" fill="#72859c" font-size="13">Page-aware metadata</text>

    <text x="349" y="165" fill="#5eead4" font-size="14" font-weight="700">02 · INDEX</text>
    <text x="349" y="199" fill="#f8fafc" font-size="21" font-weight="700">Lexical + vector</text>
    <text x="349" y="226" fill="#b4c3d4" font-size="15">PostgreSQL FTS · pgvector</text>
    <text x="349" y="247" fill="#72859c" font-size="13">BGE-M3 embeddings</text>

    <text x="626" y="165" fill="#a5b4fc" font-size="14" font-weight="700">03 · RETRIEVE</text>
    <text x="626" y="199" fill="#f8fafc" font-size="21" font-weight="700">Rank + govern</text>
    <text x="626" y="226" fill="#b4c3d4" font-size="15">RRF · optional reranking</text>
    <text x="626" y="247" fill="#72859c" font-size="13">ACL · tenant isolation</text>

    <text x="903" y="165" fill="#f0abfc" font-size="14" font-weight="700">04 · GENERATE</text>
    <text x="903" y="199" fill="#f8fafc" font-size="21" font-weight="700">Grounded response</text>
    <text x="903" y="226" fill="#b4c3d4" font-size="15">Ollama local LLM</text>
    <text x="903" y="247" fill="#72859c" font-size="13">Prompt controls</text>
  </g>

  <g stroke="url(#flow)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M298 195h22"/><path d="M575 195h22"/><path d="M852 195h22"/>
  </g>
  <g fill="#8b7cf6">
    <path d="M318 187l12 8-12 8z"/><path d="M595 187l12 8-12 8z"/><path d="M872 187l12 8-12 8z"/>
  </g>

  <path d="M42 294H1158" stroke="#26344a" stroke-width="2"/>
  <text x="48" y="329" fill="#92a4ba" font-family="Arial, sans-serif" font-size="14" font-weight="700">EVIDENCE AND FAILURE HANDLING</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="48" y="352" width="353" height="112" rx="18" fill="#172c3a" stroke="#3e7185"/>
    <rect x="424" y="352" width="353" height="112" rx="18" fill="#1d203b" stroke="#4b4a83"/>
    <rect x="800" y="352" width="352" height="112" rx="18" fill="#34263a" stroke="#865c84"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="72" y="386" fill="#7dd3fc" font-size="14" font-weight="700">05 · CONTEXT</text>
    <text x="72" y="415" fill="#f8fafc" font-size="19" font-weight="700">Page-level provenance</text>
    <text x="72" y="440" fill="#b4c3d4" font-size="14">Context expansion · source trace</text>
    <text x="448" y="386" fill="#a5b4fc" font-size="14" font-weight="700">06 · VALIDATE</text>
    <text x="448" y="415" fill="#f8fafc" font-size="19" font-weight="700">Citations and guardrails</text>
    <text x="448" y="440" fill="#b4c3d4" font-size="14">Output checks · no-evidence handling</text>
    <text x="824" y="386" fill="#f0abfc" font-size="14" font-weight="700">07 · MEASURE</text>
    <text x="824" y="415" fill="#f8fafc" font-size="19" font-weight="700">Corpus-bounded proof</text>
    <text x="824" y="440" fill="#b4c3d4" font-size="14">AnyHit@5 0.89 · citations 9/9</text>
  </g>
  <text x="48" y="516" fill="#72859c" font-family="Arial, sans-serif" font-size="13">Prototype boundary: live deployment, user scale, and enterprise readiness are not implied.</text>
</svg>

