<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI and ML engineering portfolio map</title>
  <desc id="desc">A visual map connecting document AI, retrieval, machine learning, and deployable applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c35"/>
      <stop offset="1" stop-color="#152c45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill: #8ea5c5; font-size: 15px; font-weight: 700; letter-spacing: 3px; }
      .title { fill: #f8fafc; font-size: 36px; font-weight: 800; letter-spacing: .5px; }
      .sub { fill: #c7d2fe; font-size: 17px; }
      .card { fill: #16243b; stroke: #334968; stroke-width: 1.5; }
      .cardTitle { fill: #f8fafc; font-size: 16px; font-weight: 800; }
      .cardText { fill: #9fb3ce; font-size: 13px; }
      .line { stroke: url(#accent); stroke-width: 2.5; stroke-linecap: round; opacity: .8; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="1090" cy="-10" r="190" fill="#7c3aed" opacity=".11"/>
  <circle cx="90" cy="380" r="170" fill="#06b6d4" opacity=".08"/>
  <path d="M42 286 C250 210 340 330 532 258 S850 188 1158 268" fill="none" stroke="#466388" stroke-width="1" opacity=".45"/>

  <text x="56" y="58" class="sans eyebrow">AI / ML ENGINEERING PORTFOLIO</text>
  <text x="56" y="104" class="sans title">From evidence to useful AI systems</text>
  <text x="56" y="135" class="sans sub">RAG · LLM applications · applied machine learning · data engineering</text>

  <g filter="url(#glow)">
    <circle cx="603" cy="180" r="5" fill="#67e8f9"/>
    <circle cx="603" cy="180" r="13" fill="none" stroke="#67e8f9" opacity=".38"/>
  </g>
  <path d="M250 220 H330 M520 220 H600 M690 220 H770 M960 220 H1040" class="line"/>
  <path d="M325 216 l10 4 -10 4 M595 216 l10 4 -10 4 M765 216 l10 4 -10 4 M1035 216 l10 4 -10 4" fill="#a78bfa"/>

  <g>
    <rect x="56" y="166" width="194" height="112" rx="14" class="card"/>
    <circle cx="84" cy="197" r="13" fill="#0e7490" opacity=".9"/>
    <path d="M77 197h14M84 190v14" stroke="#cffafe" stroke-width="2"/>
    <text x="108" y="202" class="sans cardTitle">Document AI</text>
    <text x="76" y="230" class="sans cardText">PDF / OCR ingestion</text>
    <text x="76" y="251" class="sans cardText">provenance · ACLs</text>
  </g>

  <g>
    <rect x="336" y="166" width="184" height="112" rx="14" class="card"/>
    <circle cx="364" cy="197" r="13" fill="#4338ca" opacity=".9"/>
    <path d="M357 197h14M360 192l-3 5 3 5M368 192l3 5-3 5" fill="none" stroke="#e0e7ff" stroke-width="1.7"/>
    <text x="388" y="202" class="sans cardTitle">Retrieval</text>
    <text x="356" y="230" class="sans cardText">dense + hybrid search</text>
    <text x="356" y="251" class="sans cardText">pgvector · reranking</text>
  </g>

  <g>
    <rect x="610" y="166" width="164" height="112" rx="14" class="card"/>
    <circle cx="638" cy="197" r="13" fill="#7c3aed" opacity=".9"/>
    <path d="M631 193h14v9h-14zM634 189v4M642 189v4M635 205h6" fill="none" stroke="#f5f3ff" stroke-width="1.7"/>
    <text x="662" y="202" class="sans cardTitle">Models</text>
    <text x="630" y="230" class="sans cardText">fraud / risk ML</text>
    <text x="630" y="251" class="sans cardText">evaluation · explainability</text>
  </g>

  <g>
    <rect x="810" y="166" width="194" height="112" rx="14" class="card"/>
    <circle cx="838" cy="197" r="13" fill="#0f766e" opacity=".9"/>
    <path d="M831 194h14v10h-14zM834 190h8M834 208h8" fill="none" stroke="#ccfbf1" stroke-width="1.7"/>
    <text x="862" y="202" class="sans cardTitle">Applications</text>
    <text x="830" y="230" class="sans cardText">FastAPI · Streamlit</text>
    <text x="830" y="251" class="sans cardText">tests · model artifacts</text>
  </g>

  <text x="56" y="326" class="mono" fill="#7890b0" font-size="13">BUILD → RETRIEVE / LEARN → EVALUATE → SERVE</text>
  <text x="1144" y="326" text-anchor="end" class="mono" fill="#7890b0" font-size="13">PYTHON · SQL</text>
</svg>

