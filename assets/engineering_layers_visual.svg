<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Verified AI and ML engineering layers</title>
  <desc id="desc">A portfolio map from documents and datasets through retrieval and machine learning to APIs, applications, evaluation, and provenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#42d6c5"/>
      <stop offset="1" stop-color="#8b7cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <path d="M42 86H1158" stroke="#26344a" stroke-width="2"/>
  <text x="48" y="55" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">VERIFIED AI / ML ENGINEERING LAYERS</text>
  <text x="48" y="77" fill="#92a4ba" font-family="Arial, sans-serif" font-size="14">A traceable path from inputs to evaluated applications</text>

  <g filter="url(#shadow)">
    <rect x="48" y="124" width="250" height="122" rx="18" fill="#142234" stroke="#2c4862"/>
    <rect x="325" y="124" width="250" height="122" rx="18" fill="#152331" stroke="#2c5c63"/>
    <rect x="602" y="124" width="250" height="122" rx="18" fill="#1d203b" stroke="#4b4a83"/>
    <rect x="879" y="124" width="273" height="122" rx="18" fill="#2a2135" stroke="#77506f"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="72" y="157" fill="#7dd3fc" font-size="14" font-weight="700">01  INPUTS</text>
    <text x="72" y="190" fill="#f8fafc" font-size="21" font-weight="700">Documents + datasets</text>
    <text x="72" y="218" fill="#b4c3d4" font-size="15">PDF / OCR · tabular data</text>

    <text x="349" y="157" fill="#5eead4" font-size="14" font-weight="700">02  INTELLIGENCE</text>
    <text x="349" y="190" fill="#f8fafc" font-size="21" font-weight="700">Retrieval + ML + LLM</text>
    <text x="349" y="218" fill="#b4c3d4" font-size="15">Embeddings · models · prompts</text>

    <text x="626" y="157" fill="#a5b4fc" font-size="14" font-weight="700">03  APPLICATION</text>
    <text x="626" y="190" fill="#f8fafc" font-size="21" font-weight="700">API + workflow surface</text>
    <text x="626" y="218" fill="#b4c3d4" font-size="15">FastAPI · Streamlit · Flask</text>

    <text x="903" y="157" fill="#f0abfc" font-size="14" font-weight="700">04  PROOF</text>
    <text x="903" y="190" fill="#f8fafc" font-size="21" font-weight="700">Evaluation + provenance</text>
    <text x="903" y="218" fill="#b4c3d4" font-size="15">Tests · citations · artifacts</text>
  </g>

  <g stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 185h22"/><path d="M575 185h22"/><path d="M852 185h22"/>
  </g>
  <g fill="#8b7cf6">
    <path d="M318 177l12 8-12 8z"/><path d="M595 177l12 8-12 8z"/><path d="M872 177l12 8-12 8z"/>
  </g>

  <path d="M48 284H1152" stroke="#26344a" stroke-width="2"/>
  <text x="48" y="321" fill="#92a4ba" font-family="Arial, sans-serif" font-size="14" font-weight="700">REPOSITORY EVIDENCE MAP</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="48" y="345" width="250" height="58" rx="15" fill="#12333a" stroke="#2c8b86"/>
    <text x="70" y="380" fill="#bff8ef">PORT RAG · flagship</text>
    <rect x="325" y="345" width="250" height="58" rx="15" fill="#302548" stroke="#7459b5"/>
    <text x="347" y="380" fill="#ddd6fe">CLAIMSHIELD · fraud ML</text>
    <rect x="602" y="345" width="250" height="58" rx="15" fill="#26334a" stroke="#5578a8"/>
    <text x="624" y="380" fill="#cce0ff">INSURERISK · evaluation</text>
    <rect x="879" y="345" width="273" height="58" rx="15" fill="#3b2931" stroke="#a66b6b"/>
    <text x="901" y="380" fill="#ffe0df">SPARK · data engineering</text>
  </g>
  <text x="48" y="446" fill="#72859c" font-family="Arial, sans-serif" font-size="13">Portfolio map reflects repository evidence; deployment scale and business impact are intentionally not implied.</text>
</svg>

